# Приложение + мониторинг. Запуск: ./scripts/run_local.sh  (или docker compose up -d --build)
services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${APP_IMAGE:-homework1-app:latest}
    container_name: hw1-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data        # база заметок переживает пересоздание контейнера

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hw1-prometheus
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: hw1-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # просмотр без логина, чтобы дашборд открывался сразу; админ: admin / admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/app.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  app-data:
  prometheus-data:
  grafana-data:
