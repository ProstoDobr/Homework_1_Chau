version: "3.9"

services:
  app:
    build: .
    image: ${APP_IMAGE:-homework1-app:latest}
    container_name: hw1-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data          # чтобы заметки переживали пересоздание контейнера
    environment:
      - DB_PATH=/data/notes.db

  # --- мониторинг -----------------------------------------------------------

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: hw1-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    # метрики хоста: сколько CPU/памяти доступно и потребляется на всей машине

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: hw1-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # метрики по каждому контейнеру: сколько CPU/памяти РЕАЛЬНО жрёт app

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hw1-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # веб-интерфейс с метриками/графиками

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: hw1-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"   # красивые дашборды (логин/пароль по умолчанию admin/admin)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  app-data:
  prometheus-data:
  grafana-data:
