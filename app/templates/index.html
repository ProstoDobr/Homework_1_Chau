{% extends "base.html" %}
{% block content %}
<div class="card new">
  <form method="post" action="{{ url_for('create_note') }}">
    <input type="text" name="title" placeholder="Заголовок" maxlength="200" required>
    <textarea name="body" rows="2" placeholder="Текст заметки" maxlength="5000"></textarea>
    <button type="submit">Добавить заметку</button>
  </form>
</div>

{% for note in notes %}
<div class="card">
  <form method="post" action="{{ url_for('edit_note', note_id=note['id']) }}">
    <input type="text" name="title" value="{{ note['title'] }}" maxlength="200">
    <textarea name="body" rows="2" maxlength="5000">{{ note['body'] }}</textarea>
    <small>обновлено: {{ note['updated_at'] | ts }}</small><br>
    <button type="submit">Сохранить</button>
    <button type="submit" class="danger" formaction="{{ url_for('delete_note', note_id=note['id']) }}">Удалить</button>
  </form>
</div>
{% else %}
<p><em>Заметок пока нет — добавьте первую.</em></p>
{% endfor %}
{% endblock %}
