global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]     # наше приложение: посещения/час + собственные ресурсы

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]   # ресурсы всего хоста (доступно/занято)

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]        # ресурсы конкретно контейнера app
