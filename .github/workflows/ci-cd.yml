name: CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  IMAGE_NAME: prostodobr/homework_1_chau
  REGISTRY: ghcr.io

jobs:
  # 1) СБОРКА: собираем образ, прогоняем базовую проверку (health check внутри
  #    контейнера) и сохраняем сам образ как артефакт CI — это то самое
  #    "сохраняем сборку в виде артефакта", которое требуется в задании.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t app:${{ github.sha }} .

      - name: Smoke test (поднимаем контейнер и проверяем /health)
        run: |
          docker run -d --name smoke -p 8000:8000 app:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          docker rm -f smoke

      - name: Save image as artifact
        run: docker save app:${{ github.sha }} -o app-image.tar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image-${{ github.sha }}
          path: app-image.tar
          retention-days: 14

  # 2) ПУБЛИКАЦИЯ: пушим тот же образ в container registry (GHCR), чтобы
  #    сервер мог просто сделать `docker pull`, не пересобирая заново.
  push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
